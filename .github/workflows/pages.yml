name: Publish browser app

on:
  push:
    branches: [main]
    paths:
      - docs/demo/Brummie-Offline.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public standalone HTML
        run: |
          mkdir -p "$RUNNER_TEMP/brummie-pages"
          cp docs/demo/Brummie-Offline.html "$RUNNER_TEMP/brummie-pages/index.html"
          touch "$RUNNER_TEMP/brummie-pages/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/brummie-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
