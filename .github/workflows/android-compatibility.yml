name: Android 8 compatibility
on:
  push:
    branches: [main]
    paths:
      - android/**
      - scripts/android-install-smoke.sh
      - .github/workflows/android-compatibility.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android8:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SIGNED: "false"
      API_LEVEL: "26"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the same release-mode test APK
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p android/app/src/main/assets release/android
          cp dist/index.html android/app/src/main/assets/index.html
          cd android
          gradle --no-daemon :app:assembleRelease -PappVersion="$version"
          cp app/build/outputs/apk/release/app-release.apk ../release/android/Brummie-Android-TEST.apk
      - name: Enable KVM access
        run: sudo chmod a+rw /dev/kvm
      - name: Install and launch on Android 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/android-install-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android8-diagnostics
          path: test-results/android-install/*
