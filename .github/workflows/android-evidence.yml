name: Publish verified Android usability screenshots
on:
  push:
    branches: [main]
    paths: [.github/workflows/android-evidence.yml]
permissions:
  contents: write
  actions: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-api-35-diagnostics
          run-id: 38915950342
          github-token: ${{ github.token }}
          path: /tmp/android-proof
      - name: Publish screenshots from the successful native test
        run: |
          cp /tmp/android-proof/phone-keyboard.png docs/screenshots/17-android-teclado.png
          cp /tmp/android-proof/phone-form.png docs/screenshots/18-android-formulario.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/17-android-teclado.png docs/screenshots/18-android-formulario.png
          git commit -m 'docs: show verified native Android keyboard and retained form'
          git push origin HEAD:main
