name: Cancel superseded release attempts
on:
  push:
    branches: [main]
    paths: [.github/workflows/android-evidence.yml]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the current release and stop only our obsolete attempts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for run in 38914054039 38914585719 38914893373 38915161779; do
            status="$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .status)"
            if [ "$status" != completed ]; then gh run cancel "$run"; fi
          done
