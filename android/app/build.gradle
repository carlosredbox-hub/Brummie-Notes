plugins { id 'com.android.application' }
def releaseVersion = providers.gradleProperty('appVersion').getOrElse('1.0.0')
def parts = releaseVersion.tokenize('.').collect { it.toInteger() }
def hasSigning = System.getenv('ANDROID_KEYSTORE_PATH') != null
android {
    namespace 'com.brummie.documents'
    compileSdk 35
    defaultConfig {
        applicationId 'com.brummie.documents'
        minSdk 26
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName releaseVersion
        manifestPlaceholders = [appLabel: "Brummie Offline"]
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Always distribute the non-debuggable release build. Without a
            // production key, keep the isolated TEST identity and test signing.
            signingConfig(hasSigning ? signingConfigs.release : signingConfigs.debug)
            if (!hasSigning) {
                applicationIdSuffix ".test.v${releaseVersion.replace('.', '_')}"
                manifestPlaceholders = [appLabel: "Brummie TEST ${releaseVersion}"]
            }
        }
        debug {
            if (!hasSigning) {
                // Temporary test keys differ between runners. Isolate each test
                // version so installation never replaces an existing user's app.
                applicationIdSuffix ".test.v${releaseVersion.replace('.', '_')}"
                manifestPlaceholders = [appLabel: "Brummie TEST ${releaseVersion}"]
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
