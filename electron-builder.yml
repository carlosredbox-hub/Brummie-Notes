appId: com.brummie.documents
productName: Brummie Documents
asar: true
npmRebuild: false
files:
  - desktop/**/*
  - dist/**/*
  - src/assets/icon.png
  - build/icon.ico
  - package.json
  - "!node_modules/**/*"
directories:
  output: release/windows
win:
  icon: build/icon.ico
  signAndEditExecutable: true
  signExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: Brummie-Documents-${version}-Windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
